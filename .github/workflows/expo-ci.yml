name: WildBear HQ CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  smoke-check:
    name: Expo project smoke check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Verify package metadata
        run: node -e "const pkg=require('./package.json'); if(!pkg.scripts || !pkg.scripts.start){ throw new Error('Missing start script'); } console.log('Package OK:', pkg.name);"

      - name: Expo dependency check
        run: npx expo install --check

      - name: Basic source sanity check
        run: node -e "const fs=require('fs'); const app=fs.readFileSync('App.js','utf8'); if(!app.includes('export default function App')){ throw new Error('App.js missing default App export'); } console.log('App.js sanity check passed');"
