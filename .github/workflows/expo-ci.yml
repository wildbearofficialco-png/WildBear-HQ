name: WildBear HQ CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  smoke-check:
    name: Expo project smoke check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Verify package metadata
        run: node -e "const pkg=require('./package.json'); if(!pkg.scripts || !pkg.scripts.start){ throw new Error('Missing start script'); } if(!pkg.dependencies || !pkg.dependencies.expo){ throw new Error('Missing Expo dependency'); } console.log('Package OK:', pkg.name);"

      - name: Verify app config
        run: node -e "const cfg=require('./app.json'); if(!cfg.expo || !cfg.expo.name){ throw new Error('Missing expo app config'); } console.log('Expo config OK:', cfg.expo.name);"

      - name: Basic source sanity check
        run: node -e "const fs=require('fs'); const app=fs.readFileSync('App.js','utf8'); if(!app.includes('export default function App')){ throw new Error('App.js missing default App export'); } if(!app.includes('WildBear')){ throw new Error('App.js missing WildBear branding'); } if(!app.includes('Snack-safe local session')){ throw new Error('App.js missing Snack-safe runtime marker'); } console.log('App.js sanity check passed');"

      - name: Architecture file sanity check
        run: node -e "const fs=require('fs'); ['storage/persistence.js','constants/theme.js','components/ui.js','data/starterData.js'].forEach(path=>{ if(!fs.existsSync(path)){ throw new Error('Missing architecture file: '+path); } }); console.log('Architecture files present');"
